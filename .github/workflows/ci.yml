name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install (workspaces: shared + server + web)
        run: npm ci
      - name: Tests (shared + server)
        run: npm test
      - name: Typecheck (all workspaces)
        run: npx tsc -b shared server web
      - name: Build (shared dist + web dashboard)
        run: npm run build -w shared -w web
